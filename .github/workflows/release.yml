name: Release

on:
  push:
    tags: ['v*.*.*']
  # 手動執行＝試跑：只產生 artifacts，不建立 GitHub Release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.value }}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.version.outputs.value }}"
            exit 1
          fi

      - run: pnpm compile
      - run: pnpm test

      # 自行安裝版：保留 manifest key，固定擴充 ID
      - name: Package release build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b firefox
          mkdir -p dist/release
          mv ".output/poexd-extension-${VERSION}-chrome.zip" "dist/release/poexd-extension-${VERSION}-chromium.zip"
          mv ".output/poexd-extension-${VERSION}-sources.zip" "dist/release/"
          rm -rf .output

      # 商店版：移除 manifest key，由商店指派 ID；只放 artifacts，不公開
      - name: Package store builds
        env:
          VERSION: ${{ steps.version.outputs.value }}
          POEXD_STORE_BUILD: '1'
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b edge
          pnpm wxt zip -b firefox
          mkdir -p dist/store
          mv .output/*.zip dist/store/
          if unzip -p "dist/store/poexd-extension-${VERSION}-chrome.zip" manifest.json | grep -q '"key"'; then
            echo "::error::Store build must not contain a manifest key" && exit 1
          fi

      - name: Lint Firefox store package
        run: |
          mkdir -p /tmp/firefox-store
          unzip -q "dist/store/poexd-extension-${{ steps.version.outputs.value }}-firefox.zip" -d /tmp/firefox-store
          pnpm exec web-ext lint --source-dir /tmp/firefox-store

      - name: Checksums
        working-directory: dist/release
        run: sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.zip

      - name: Upload store packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-packages-${{ steps.version.outputs.value }}
          path: dist/store/*.zip
          retention-days: 30

      - name: Upload release packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-${{ steps.version.outputs.value }}
          path: dist/release/*
          retention-days: 7

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --draft $PRERELEASE \
            --title "PoeXD Extension v${VERSION}" \
            --notes-file release-notes.md
