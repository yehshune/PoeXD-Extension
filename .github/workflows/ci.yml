name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 純文件變更時跳過檢查，但仍讓 ci-ok 回報成功，分支保護才不會卡住
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!LICENSE'

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm compile
      - run: pnpm test

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm wxt build -b ${{ matrix.browser }}
      - name: Lint Firefox package
        if: matrix.browser == 'firefox'
        run: pnpm exec web-ext lint --source-dir .output/firefox-mv3
      # main 上的建置保留 14 天，方便搶先測試
      - name: Upload build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: poexd-${{ matrix.browser }}-${{ github.sha }}
          path: .output/${{ matrix.browser }}-mv3
          retention-days: 14

  ci-ok:
    if: always()
    needs: [changes, verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed" && exit 1
          fi
