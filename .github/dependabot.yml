version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7（原生編譯器）尚無 compiler API，@vue/compiler-sfc 與 vue-tsc 無法使用
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    # Actions 以 commit SHA 鎖定；Dependabot 會同步更新 SHA 與版本註解。
    # 本地 composite action 不在預設掃描範圍，需明確列出。
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
