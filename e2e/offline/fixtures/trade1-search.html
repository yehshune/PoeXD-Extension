<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trade - Path of Exile</title>
  </head>
  <body>
    <!--
      PoE1 官方搜尋頁的最小替身：沒有官方的 Vue app，只照官方的請求順序（search → fetch）打 API，
      再依官方結果列的 DOM 結構畫出 `.results .resultset .row[data-id]`。API 回應由 fixtures.ts 回放。
    -->
    <div id="trade">
      <div class="content">
        <div class="search-panel">
          <div class="search-bar">
            <div class="search-left"><input type="text" placeholder="Search Items..." /></div>
          </div>
          <div class="search-advanced"></div>
        </div>
        <div class="results compact two">
          <div class="resultset"></div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function modLine(mod, kind) {
          const text = typeof mod === 'string' ? mod : mod.description;
          const line = el('div', `item-mod item-mod--${kind}`);
          const stat = el('span', 's lc');
          if (typeof mod === 'object' && mod.hash) stat.setAttribute('data-field', mod.hash);
          stat.append(el('span', '', text));
          line.append(stat);
          return line;
        }

        function renderRow({ id, item, listing }) {
          const row = el('div', 'row');
          row.setAttribute('data-id', id);

          const left = el('div', 'left');
          left.append(el('button', 'copy'), el('button', 'searchBy'));

          const popup = el('div', `item-popup item-popup--${item.rarity.toLowerCase()}`);
          const header = el('div', 'item-popup__header');
          if (item.name) header.append(el('div', 'item-popup__header-line', item.name));
          header.append(el('div', 'item-popup__header-line', item.typeLine));
          const content = el('div', 'item-popup__content');
          for (const mod of item.implicitMods ?? []) content.append(modLine(mod, 'implicit'));
          for (const mod of item.explicitMods ?? []) content.append(modLine(mod, 'explicit'));
          popup.append(header, content);
          const middle = el('div', 'middle');
          middle.append(popup);

          const price = el('div', 'price');
          const priceField = el('span', 's');
          priceField.setAttribute('data-field', 'price');
          priceField.append(
            el('span', 'price-label buyout-price', 'Price:'),
            el('span', '', String(listing.price.amount)),
            el('span', '', '×'),
            el('span', 'currency-text', listing.price.currency),
          );
          price.append(priceField);
          const details = el('div', 'details');
          details.append(price, el('div', 'btns'));
          const right = el('div', 'right');
          right.append(details);

          row.append(left, middle, right);
          return row;
        }

        async function waitFor(condition) {
          for (let i = 0; i < 200 && !condition(); i++) {
            await new Promise((resolve) => setTimeout(resolve, 50));
          }
        }

        // 擴充功能的 MAIN world 攔截器啟動時會派送一次 poexd-history-changed
        const interceptorReady = new Promise((resolve) =>
          window.addEventListener('poexd-history-changed', resolve, { once: true }),
        );

        /**
         * 官方頁面要先載入大量腳本與 4 支 data API 才會搜尋，通常此時擴充功能已初始化完畢（側邊欄已掛上）。
         * `?timing=early` 模擬官方比擴充功能初始化更快：攔截器一就緒就搜尋，
         * 此時擴充功能還在讀偏好設定、連線 background，各功能的監聽都還沒註冊。
         */
        async function waitForOfficialTiming() {
          if (new URLSearchParams(location.search).get('timing') === 'early') {
            await interceptorReady;
            return;
          }
          await waitFor(() => document.querySelector('poexd-sidebar-container') !== null);
        }

        /**
         * 照官方搜尋流程：POST search → 網址換成新的 search id（pushState）→ fetch → 重畫結果列。
         * `searchId` 交給回放端決定回傳的 id；省略時沿用目前網址的 id（直接打開搜尋網址的情況）。
         */
        async function search(searchId) {
          const [, , , league, currentId] = location.pathname.split('/');
          const result = await fetch(`/api/trade/search/${league}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-e2e-search-id': searchId ?? currentId,
            },
            body: JSON.stringify({
              query: { status: { option: 'online' }, stats: [{ type: 'and', filters: [] }] },
              sort: { price: 'asc' },
            }),
          }).then((response) => response.json());
          if (result.id !== currentId) {
            history.pushState(null, '', `/trade/search/${league}/${result.id}`);
          }
          const fetched = await fetch(
            `/api/trade/fetch/${result.result.join(',')}?query=${result.id}`,
          ).then((response) => response.json());
          const resultset = document.querySelector('.resultset');
          resultset.replaceChildren(...fetched.result.map(renderRow));
        }

        /** 測試用：模擬使用者在頁面上按下搜尋 */
        window.e2eSearch = search;

        /**
         * Trade root（`/trade`）是線上搜尋主控台開啟的頁面。主控台把即時結果寫進官方 Vuex store，
         * 這裡照 docs/architecture/live-search-host-adapter-contract.md 實作最小的替身 store：
         * 只提供 adapter 會用到的 state 與 mutation，未註冊的 mutation 會丟出例外（和官方 Vuex 一樣不會默默吞掉）。
         */
        function installOfficialStore() {
          const state = { transient: { searches: [], search: { active: null } } };
          const findSearch = (localId) =>
            state.transient.searches.find((s) => s.localId === localId);
          const mutations = {
            addSearchQuery(search) {
              state.transient.searches.push(search);
            },
            setSearchActive(search) {
              state.transient.search.active = search;
            },
            showAdvancedSearch() {},
            addSearchResult({ localId, resultId, id, result, items, total, inexact }) {
              const search = findSearch(localId);
              if (!search) return;
              // 官方把新批次 unshift 到最前面
              Object.assign(search, { id, total, inexact });
              search.results.unshift({ id: resultId, result, items: { ...items } });
              search.unreadHits += 1;
            },
            setItemForSearchResult({ localId, id, itemId, itemData }) {
              const batch = findSearch(localId)?.results.find((b) => b.id === id);
              if (batch) batch.items[itemId] = itemData;
            },
            resetActiveUnreadHits() {
              if (state.transient.search.active) state.transient.search.active.unreadHits = 0;
            },
          };
          const render = () => {
            const active = state.transient.search.active;
            const rows = (active?.results ?? [])
              .map((batch) => batch.items[batch.result[0]])
              .filter(Boolean)
              .map(renderRow);
            document.querySelector('.resultset').replaceChildren(...rows);
          };
          const store = {
            state,
            _mutations: Object.fromEntries(
              Object.keys(mutations).map((name) => [name, [mutations[name]]]),
            ),
            commit(type, payload) {
              if (!mutations[type]) throw new Error(`[vuex] unknown mutation type: ${type}`);
              mutations[type](payload);
              render();
            },
            _withCommit(fn) {
              fn();
              render();
            },
          };
          // 官方是 Vue 3 + Vuex 4：store 掛在 app 的全域屬性上
          document.querySelector('#trade').__vue_app__ = {
            config: { globalProperties: { $store: store } },
          };
        }

        const isTradeRoot = /^\/trade\/?$/.test(location.pathname);
        if (isTradeRoot) {
          installOfficialStore();
        } else {
          waitForOfficialTiming()
            .then(() => search())
            .catch((error) => console.error('[fixture] 替身頁載入失敗', error));
        }
      })();
    </script>
  </body>
</html>
