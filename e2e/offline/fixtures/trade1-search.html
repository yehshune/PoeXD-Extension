<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trade - Path of Exile</title>
  </head>
  <body>
    <!--
      PoE1 官方搜尋頁的最小替身：沒有官方的 Vue app，只照官方的請求順序（search → fetch）打 API，
      再依官方結果列的 DOM 結構畫出 `.results .resultset .row[data-id]`。API 回應由 fixtures.ts 回放。
    -->
    <div id="trade">
      <div class="content">
        <div class="search-panel">
          <div class="search-bar"></div>
          <div class="search-advanced"></div>
        </div>
        <div class="results compact two">
          <div class="resultset"></div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function modLine(mod, kind) {
          const text = typeof mod === 'string' ? mod : mod.description;
          const line = el('div', `item-mod item-mod--${kind}`);
          const stat = el('span', 's lc');
          if (typeof mod === 'object' && mod.hash) stat.setAttribute('data-field', mod.hash);
          stat.append(el('span', '', text));
          line.append(stat);
          return line;
        }

        function renderRow({ id, item, listing }) {
          const row = el('div', 'row');
          row.setAttribute('data-id', id);

          const left = el('div', 'left');
          left.append(el('button', 'copy'), el('button', 'searchBy'));

          const popup = el('div', `item-popup item-popup--${item.rarity.toLowerCase()}`);
          const header = el('div', 'item-popup__header');
          if (item.name) header.append(el('div', 'item-popup__header-line', item.name));
          header.append(el('div', 'item-popup__header-line', item.typeLine));
          const content = el('div', 'item-popup__content');
          for (const mod of item.implicitMods ?? []) content.append(modLine(mod, 'implicit'));
          for (const mod of item.explicitMods ?? []) content.append(modLine(mod, 'explicit'));
          popup.append(header, content);
          const middle = el('div', 'middle');
          middle.append(popup);

          const price = el('div', 'price');
          const priceField = el('span', 's');
          priceField.setAttribute('data-field', 'price');
          priceField.append(
            el('span', 'price-label buyout-price', 'Price:'),
            el('span', '', String(listing.price.amount)),
            el('span', '', '×'),
            el('span', 'currency-text', listing.price.currency),
          );
          price.append(priceField);
          const details = el('div', 'details');
          details.append(price, el('div', 'btns'));
          const right = el('div', 'right');
          right.append(details);

          row.append(left, middle, right);
          return row;
        }

        async function waitFor(condition) {
          for (let i = 0; i < 200 && !condition(); i++) {
            await new Promise((resolve) => setTimeout(resolve, 50));
          }
        }

        // 擴充功能的 MAIN world 攔截器啟動時會派送一次 poexd-history-changed
        const interceptorReady = new Promise((resolve) =>
          window.addEventListener('poexd-history-changed', resolve, { once: true }),
        );

        /**
         * 官方頁面要先載入大量腳本與 4 支 data API 才會搜尋，通常此時擴充功能已初始化完畢（側邊欄已掛上）。
         * `?timing=early` 模擬官方比擴充功能初始化更快：攔截器一就緒就搜尋，
         * 此時擴充功能還在讀偏好設定、連線 background，各功能的監聽都還沒註冊。
         */
        async function waitForOfficialTiming() {
          if (new URLSearchParams(location.search).get('timing') === 'early') {
            await interceptorReady;
            return;
          }
          await waitFor(() => document.querySelector('poexd-sidebar-container') !== null);
        }

        async function run() {
          await waitForOfficialTiming();
          const league = location.pathname.split('/')[3];
          const search = await fetch(`/api/trade/search/${league}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: { status: { option: 'online' }, stats: [{ type: 'and', filters: [] }] },
              sort: { price: 'asc' },
            }),
          }).then((response) => response.json());
          const fetched = await fetch(
            `/api/trade/fetch/${search.result.join(',')}?query=${search.id}`,
          ).then((response) => response.json());
          const resultset = document.querySelector('.resultset');
          for (const result of fetched.result) resultset.append(renderRow(result));
        }

        run().catch((error) => console.error('[fixture] 替身頁載入失敗', error));
      })();
    </script>
  </body>
</html>
